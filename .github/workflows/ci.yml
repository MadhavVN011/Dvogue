name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, contracts, build and browsers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test domain rules and smart contracts
        run: npm test
      - name: Build storefront
        run: npm run build
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile shopping flows
        run: npm run test:browser
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Upload browser report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
